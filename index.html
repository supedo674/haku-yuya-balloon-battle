<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ハク vs ゆや バルーンバトル</title><link rel="stylesheet" href="style.css"></head><body>
<main><header><small>2PC ONLINE · VER 4.5</small><h1>ハク <i>vs</i> ゆや<br>バルーンバトル</h1></header>
<section class="hud"><div><b>ハク</b><span id="hakuText">HP 100</span><progress id="hakuHp" max="100" value="100"></progress></div><strong id="round">ROUND 1</strong><div><b>ゆや</b><span id="yuyaText">HP 100</span><progress id="yuyaHp" max="100" value="100"></progress></div></section>
<section class="stage"><canvas id="game" width="960" height="540"></canvas><div id="finish" hidden><small>BATTLE FINISH</small><h2 id="winner"></h2><button id="restart">もう一度たたかう</button></div></section>
<section class="panel"><div id="mode-select" style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap"><button data-mode="cpu" style="flex:1;padding:10px;border:1px solid #43d9ff;border-radius:9px;background:#17364c;color:white;font-weight:800">CPU対戦</button><button data-mode="local" style="flex:1;padding:10px;border:1px solid #71405d;border-radius:9px;background:#30182a;color:white;font-weight:800">1台で2人対戦</button><button data-mode="online" style="flex:1;padding:10px;border:1px solid #ffd166;border-radius:9px;background:#493c16;color:white;font-weight:800">オンライン部屋</button></div>
<div id="room-lobby" hidden style="margin-bottom:16px;padding:16px;border:1px solid #ffd16666;border-radius:12px;background:#080a18;text-align:center"><b style="display:block;margin-bottom:5px">オンライン対戦の部屋</b><small style="display:block;margin-bottom:14px;color:#aeb1ca">部屋を作るとハク、番号から参加するとゆやになります</small><div id="room-start" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button id="create-room" style="padding:11px 18px;border:0;border-radius:9px;background:#ffd166;color:#111;font-weight:900">部屋を作る（ハク）</button><input id="room-code-input" maxlength="6" placeholder="部屋番号6桁" aria-label="部屋番号" style="width:150px;padding:10px;border:1px solid #555b80;border-radius:9px;background:#171a35;color:white;text-transform:uppercase"><button id="join-room" style="padding:11px 18px;border:1px solid #43d9ff;border-radius:9px;background:#17364c;color:white;font-weight:900">参加する（ゆや）</button></div><div id="room-created" hidden><div id="room-role" style="display:inline-block;margin-bottom:10px;padding:7px 14px;border-radius:999px;background:#ffd166;color:#111;font-weight:900"></div><small style="display:block">部屋番号</small><strong id="room-code" style="display:block;margin:6px 0;font-size:2rem;letter-spacing:.18em;color:#ffd166"></strong><button id="copy-room" style="padding:8px 15px;border:1px solid #ffd166;border-radius:8px;background:transparent;color:white">番号をコピー</button><div id="room-state" style="margin-top:13px;padding:11px;border:1px solid #4ee49a66;border-radius:9px;background:#123326;color:#7df2ae;font-weight:900">✓ 部屋作成完了</div><p id="room-status" style="margin:10px 0 0;color:#aeb1ca">ゆやの参加を待っています</p></div></div>
<div class="turn"><b id="guide">ハクの行動を選んでください</b><span id="ready">ハク：選択中 ／ CPUゆや：待機中</span></div>
<div id="actions" class="actions"><fieldset><legend>バルーン棒で攻撃</legend><button data-action="attack-head">頭 <em>25</em></button><button data-action="attack-waist">腰 <em>20</em></button><button data-action="attack-legs">足 <em>15</em></button></fieldset><fieldset><legend>防御・反撃</legend><button data-action="defend-upper">頭＋腰を守る <em>成功で反撃10</em></button><button data-action="defend-legs">足を守る <em>成功で反撃10</em></button></fieldset></div>
<p id="log" aria-live="polite">お互いの行動は、両者が選び終わるまで秘密です。</p></section></main><script src="game.js"></script><script>window.addEventListener("error",e=>{if(e.target?.tagName==="SCRIPT")document.querySelector("#log").textContent="Firebase SDKを読み込めませんでした。再読み込みしてください。"},true)</script><script defer src="https://www.gstatic.com/firebasejs/12.13.0/firebase-app-compat.js"></script><script defer src="https://www.gstatic.com/firebasejs/12.13.0/firebase-auth-compat.js"></script><script defer src="https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore-compat.js"></script><script defer src="firebase-network.js"></script></body></html>
