<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ハクvsゆや バルーンバトル</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section id="title-screen" class="title-screen">
      <img src="assets/title.png" alt="ハクとゆやのバルーンバトル">
      <div class="title-card">
        <small>HAKU VS YUYA</small>
        <h1>ハクvsゆや<br>バルーンバトル</h1>
        <p>攻撃と防御を選んで、相手のHPを0にしよう！</p>
        <div id="mode-select" class="mode-select">
          <button data-mode="cpu">CPU対戦</button>
          <button data-mode="local">1台で2人対戦</button>
          <button data-mode="online">オンライン部屋</button>
        </div>
      </div>
    </section>

    <section id="battle-screen" class="battle-screen" hidden>
      <header class="battle-header">
        <button id="back-title">← トップ</button>
        <h1>ハクvsゆや バルーンバトル</h1>
        <small>2PC ONLINE · VER 4.9</small>
      </header>

      <section class="panel control-panel">
        <div id="room-lobby" hidden>
          <b>オンライン対戦の部屋</b>
          <small>部屋を作るとハク、番号から参加するとゆやになります</small>
          <div id="room-start">
            <button id="create-room">部屋を作る（ハク）</button>
            <input id="room-code-input" maxlength="6" placeholder="部屋番号6桁" aria-label="部屋番号">
            <button id="join-room">参加する（ゆや）</button>
          </div>
          <div id="room-created" hidden>
            <div id="room-role"></div>
            <small>部屋番号</small>
            <strong id="room-code"></strong>
            <button id="copy-room">番号をコピー</button>
            <div id="room-state">✓ 部屋作成完了</div>
            <p id="room-status">ゆやの参加を待っています</p>
          </div>
        </div>
        <div class="turn"><b id="guide">ハクの行動を選んでください</b><span id="ready">ハク：選択中 ／ CPUゆや：待機中</span></div>
        <div id="actions" class="actions">
          <fieldset><legend>バルーン棒で攻撃</legend><button data-action="attack-head">頭 <em>25</em></button><button data-action="attack-waist">腰 <em>20</em></button><button data-action="attack-legs">足 <em>15</em></button></fieldset>
          <fieldset><legend>防御・反撃</legend><button data-action="defend-upper">頭＋腰を守る <em>成功で反撃10</em></button><button data-action="defend-legs">足を守る <em>成功で反撃10</em></button></fieldset>
        </div>
        <p id="log" aria-live="polite">お互いの行動は、両者が選び終わるまで秘密です。</p>
      </section>

      <section class="hud"><div><b>ハク</b><span id="hakuText">HP 100</span><progress id="hakuHp" max="100" value="100"></progress></div><strong id="round">ROUND 1</strong><div><b>ゆや</b><span id="yuyaText">HP 100</span><progress id="yuyaHp" max="100" value="100"></progress></div></section>
      <section class="stage"><canvas id="game" width="960" height="540"></canvas><div id="finish" hidden><small>BATTLE FINISH</small><h2 id="winner"></h2><button id="restart">もう一度たたかう</button></div></section>
    </section>
  </main>
  <script src="game.js"></script>
  <script>window.addEventListener("error",e=>{if(e.target?.tagName==="SCRIPT")document.querySelector("#log").textContent="Firebase SDKを読み込めませんでした。再読み込みしてください。"},true)</script>
  <script defer src="https://www.gstatic.com/firebasejs/12.13.0/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/12.13.0/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore-compat.js"></script>
  <script defer src="firebase-network.js"></script>
</body>
</html>
